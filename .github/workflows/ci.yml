name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 测试 + 新增代码覆盖率门禁。
  # 测试工程挂载真游戏 DLL（lib/ 九件套入库，仓库自带完整物料），通配链入产品源码，
  # 全量测试覆盖游戏耦合层；覆盖率报告只含实际编译的文件，diff-cover 天然只检查能测的文件。
  test:
    name: Test + patch coverage gate (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover 需要 origin/main 做差分

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests with coverage
        run: |
          dotnet tool install -g dotnet-coverage
          cd AutoInority.Test
          ~/.dotnet/tools/dotnet-coverage collect "dotnet test" -f cobertura -o ../coverage.cobertura.xml

      - name: Patch coverage gate
        run: |
          pip install diff-cover
          diff-cover coverage.cobertura.xml --compare-branch origin/main --fail-under 80

  # net35 编译检查（等价本地 pre-commit 的 mcs 验证）。lib/ 九件套 DLL 入库，checkout 即可用。
  build-net35:
    name: mcs net35 build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mono and net35 reference assemblies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-devel
          curl -sL https://www.nuget.org/api/v2/package/microsoft.netframework.referenceassemblies.net35 --output /tmp/net35.zip
          mkdir -p "$HOME/net35"
          unzip -q /tmp/net35.zip 'build/.NETFramework/v3.5/*' -d "$HOME/net35"

      - name: Compile with mcs
        run: |
          R="$HOME/net35/build/.NETFramework/v3.5"
          cd AutoInority
          mcs -noconfig -nostdlib -target:library -optimize+ -langversion:latest \
            -r:"$R/mscorlib.dll" -r:"$R/System.dll" -r:"$R/System.Core.dll" -r:"$R/System.Xml.dll" \
            -r:lib/0Harmony.dll -r:lib/Assembly-CSharp.dll \
            -r:lib/UnityEngine.dll -r:lib/UnityEngine.CoreModule.dll -r:lib/UnityEngine.AnimationModule.dll -r:lib/UnityEngine.ImageConversionModule.dll -r:lib/UnityEngine.TextRenderingModule.dll -r:lib/UnityEngine.UIModule.dll \
            -r:lib/UnityEngine.UI.dll \
            -out:/tmp/inority_Automation_MOD.dll \
            $(grep -o 'Include="[^"]*\.cs"' AutoInority.csproj | sed 's/Include="//;s/"$//' | tr '\\' '/')
          echo "net35 build OK"
